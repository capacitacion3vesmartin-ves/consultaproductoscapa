function parseCSV(t){const r=[];let w=[],c='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){w.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;w.push(c);c='';r.push(w);w=[]}else c+=h}if(c!==''||w.length){w.push(c);r.push(w)}return r}
function toData(rows){if(rows.length<2)throw 0;const ks=rows[0].map(h=>{const n=norm(h).replace(/[^a-z0-9]/g,''),r=HR.find(x=>x[1].test(n));return r?r[0]:null});if(!ks.includes('product'))throw 0;const out=[];

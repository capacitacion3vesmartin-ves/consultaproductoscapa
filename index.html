/* Diseño MARTIN — compacto, colorido y en una sola vista */
.header{height:78px;padding:10px 28px;gap:18px;border-bottom:1px solid #dfe9e3;box-shadow:0 3px 14px rgba(1,150,56,.06)}

.field:nth-last-child(-n+2){border-bottom:0}

.field:before{width:3px;background:var(--green);opacity:.0;transition:opacity .15s}
.field:hover:before{background:var(--orange);opacity:1}
.label{font-size:8px;font-weight:800;letter-spacing:1.15px;color:#6f8177;margin-bottom:3px}

let current=null;
const $=id=>document.getElementById(id);
const norm=s=>(s??'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function searchable(p){return [p.product,p.description,p.code,p.udm,p.brands,p.format,p.thickness,p.variety,p.indications,p.aliases,p.source].filter(Boolean).join(' ')}
function score(p,q){const n=norm(q); if(!n)return 0; const all=norm(searchable(p)), terms=n.split(/\s+/).filter(Boolean); let s=0; const fields=[['code',1200],['product',900],['aliases',750],['brands',500],['format',350],['thickness',350],['variety',300],['description',180],['indications',160]]; for(const [f,w] of fields){const v=norm(p[f]); if(v===n)s+=w; else if(v.includes(n))s+=w*.65} for(const t of terms){if(all.includes(t))s+=80; else return 0} return s}
function search(q){return DATA.map(p=>({p,s:score(p,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||norm(a.p.product).localeCompare(norm(b.p.product))).map(x=>x.p)}
function key(p){return DATA.indexOf(p)}
let view='start', lastQ='';
function setView(v){view=v;const b=$('backBtn');if(b)b.disabled=(v==='start');window.scrollTo(0,0)}
function renderResults(q){
  lastQ=q; const arr=search(q);
  const head='<div class="rv-head"><h2>'+arr.length+' resultado'+(arr.length===1?'':'s')+'</h2><span>para “'+esc(q.trim())+'”</span></div>';
  if(!arr.length){ $('detail').innerHTML='<div class="rv">'+head+'<div class="rv-empty">No encontramos productos con esa búsqueda. Prueba con otro nombre, código o marca.</div></div>'; setView('results'); return }
  $('detail').innerHTML='<div class="rv">'+head+'<div class="rv-grid">'+arr.slice(0,60).map(p=>
    '<button type="button" class="pcard" data-index="'+key(p)+'"><div class="pcard-img">'+
    (p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.product)+'" loading="lazy" onerror="this.outerHTML=\'<span class=ph>Sin imagen</span>\'">':'<span class="ph">Sin imagen</span>')+
    '</div><div class="pcard-body"><span class="pcard-name">'+esc(p.product)+'</span><span class="pcard-code">'+esc(p.code||'Código pendiente')+'</span>'+
    (p.brands?'<span class="pcard-brand">'+esc(p.brands)+'</span>':'')+'</div></button>').join('')+'</div></div>';
  setView('results');
}

function renderProduct(p){const fields=[['Unidad de medida',p.udm],['Marca(s)',p.brands],['Formato',p.format],['Espesor(es)',p.thickness],['Variedad',p.variety],['Otros nombres del cliente',p.aliases]].filter(x=>x[1]&&x[1]!=='-');let visual=p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.product)+'" onerror="this.nextElementSibling.style.display=\'flex\';this.remove()">':' ';visual+='<div class="placeholder" style="display:'+(p.image?'none':'flex')+'"><div class="family">'+esc(p.source==='PROYECTO APP CAPA'?'PROYECTO':'PRODUCTO')+'</div><h2>'+esc(p.product)+'</h2><div class="code">'+esc(p.code||'Código pendiente')+'</div></div>'; $('detail').innerHTML='<div class="detail"><div class="visual">'+visual+'</div><div class="info"><div class="eyebrow">'+esc(p.source==='PROYECTO APP CAPA'?'PROYECTO':'PRODUCTO')+'</div><h1>'+esc(p.product)+'</h1><div class="code">'+esc(p.code||'Código pendiente')+'</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+'<div class="fields">'+fields.map(f=>'<div class="field"><div class="label">'+esc(f[0])+'</div><div class="value">'+esc(f[1])+'</div></div>').join('')+'</div>'+(p.indications?'<div class="note"><strong>Indicaciones:</strong> '+esc(p.indications)+'</div>':'')+(p.technicalSheet?'<div class="ficha-wrap"><div class="ficha-caption">Documento disponible</div><button class="ficha-btn" type="button" onclick="openFicha('+key(p)+')"><span class="doc-icon">▣</span> Ficha técnica</button></div>':'')+'</div></div>';current=p;setView('product')}

function driveLinks(url){
  const m=(url||'').match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(m){
    const id=m[1];
    return {view:'https://drive.google.com/file/d/'+id+'/preview', open:'https://drive.google.com/file/d/'+id+'/view?usp=sharing', download:'https://drive.google.com/uc?export=download&id='+id};
  }
  return {view:url,open:url,download:url};
}
function openFicha(index){
  const p=DATA[index]; if(!p||!p.technicalSheet)return;
  const links=driveLinks(p.technicalSheet);
  $('fichaTitle').textContent='Ficha técnica · '+p.product;
  $('fichaFrame').src=links.view;
  $('fichaOpen').href=links.open;
  $('fichaDownload').href=links.download;
  $('fichaModal').classList.add('show');
  $('fichaModal').setAttribute('aria-hidden','false');
}
function closeFicha(){
  $('fichaModal').classList.remove('show');
  $('fichaModal').setAttribute('aria-hidden','true');
  $('fichaFrame').src='';
}
$('fichaClose').addEventListener('click',closeFicha);
$('fichaModal').addEventListener('click',e=>{if(e.target.id==='fichaModal')closeFicha()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('fichaModal').classList.contains('show'))closeFicha()});

const input=$('search');
function doSearch(){const q=input.value; if(!q.trim()){lastQ='';renderStart();return} renderResults(q); if(window.innerWidth<900)input.blur()}
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();doSearch()}
  else if(e.key==='Escape'){input.value='';lastQ='';renderStart()}
});
$('searchBtn').addEventListener('click',doSearch);
$('backBtn').addEventListener('click',()=>{
  if(view==='product' && lastQ.trim()){ renderResults(lastQ) }
  else if(view!=='start'){ input.value='';lastQ='';renderStart();input.focus() }
});
$('detail').addEventListener('click',e=>{const b=e.target.closest('.pcard');if(!b)return;const p=DATA[Number(b.dataset.index)];if(p)renderProduct(p)});
renderStart();

/* ===== Carga de datos desde Google Sheets (CSV publicado) ===== */
const SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vQTQq2zWOp9WwcOrHKIFiESr7GouhZPtyP-nhGFvDkniVMscata7x1CLT286erotuEo2Ug9os5M0A6P/pub?output=csv';
const HEADER_RULES=[
  ['image',/imagen|^image$|^foto/],['product',/^producto|^product$/],['description',/quees|descripcion|^description/],
  ['code',/codigo|^code$/],['udm',/^udm$|unidaddemedida/],['brands',/^marca|^brands?$/],
  ['format',/^formato|^format$/],['thickness',/^espesor|^thickness/],['variety',/^variedad|^variety$/],
  ['indications',/^indicacion|^indications$/],['aliases',/^otrosnombres|^alias/],['technicalSheet',/^ficha|^technicalsheet/]
];
const SOURCE_BY_ROW=new Map(DATA.map(p=>[norm(p.product)+'|'+norm(p.code),p.source]));
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur);cur='' }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur='';rows.push(row);row=[] }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function rowsToData(rows){
  if(rows.length<2) throw new Error('CSV vacío');
  const keys=rows[0].map(h=>{
    const n=norm(h).replace(/[^a-z0-9]/g,'');
    const r=HEADER_RULES.find(x=>x[1].test(n));
    return r?r[0]:null;
  });
  if(!keys.includes('product')) throw new Error('No parece el CSV esperado (sin columna Producto)');
  const out=[];
  for(let r=1;r<rows.length;r++){
    const o={};
    HEADER_RULES.forEach(x=>o[x[0]]='');
    keys.forEach((k,i)=>{ if(k) o[k]=(rows[r][i]??'').toString().trim() });
    if(!o.product) continue;
    o.source=SOURCE_BY_ROW.get(norm(o.product)+'|'+norm(o.code))||'PRODUCTOS';
    out.push(o);
  }
  return out;
}
/* ID real de la hoja: es el texto largo de la URL cuando editas la hoja
   (docs.google.com/spreadsheets/d/ESTE_TEXTO/edit). La hoja debe estar compartida como
   "Cualquier persona con el enlace: Lector". Con el ID puesto, la carga funciona en file:// */
const SHEET_ID='1ggO4vnnv0X-UgA794v6J6hfEeKIZPYb7GCJMoaFcn1w';
const SHEET_GID='0';   /* opcional: número que sale como gid= en la URL de la pestaña */
function loadViaScript(){
  return new Promise((res,rej)=>{
    if(!SHEET_ID) return rej(new Error('SHEET_ID vacío'));
    const cb='__sheetCb'+Date.now(), s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();rej(new Error('sin respuesta (¿hoja no compartida con el enlace?)'))},10000);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}
    window[cb]=json=>{
      try{
        cleanup();
        if(json.status==='error') throw new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'error gviz');
        const tb=json.table, labels=tb.cols.map(c=>c.label||'');
        const grid=tb.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null?c.f:(c.v!=null?c.v:'')):''));
        const hasHdr=labels.some(l=>HEADER_RULES.some(x=>x[1].test(norm(l).replace(/[^a-z0-9]/g,''))));
        res(rowsToData(hasHdr?[labels].concat(grid):grid));
      }catch(e){rej(e)}
    };
    s.onerror=()=>{cleanup();rej(new Error('no se pudo cargar el script'))};
    s.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&headers=1'+(SHEET_GID?'&gid='+SHEET_GID:'')+'&_='+Date.now();
    document.head.appendChild(s);
  });
}
function loadViaCSV(){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),8000);
  return fetch(SHEET_CSV+'&t='+Date.now(),{cache:'no-store',signal:ctl.signal})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text() })
    .then(tx=>rowsToData(parseCSV(tx)))
    .finally(()=>clearTimeout(t));
}
async function loadSheet(){
  const errs=[];
  for(const [name,fn] of [['gviz (script)',loadViaScript],['CSV directo',loadViaCSV]]){
    try{
      const data=await fn();
      if(data.length){ console.info('Datos cargados desde Google Sheets ('+name+'): '+data.length+' productos'); return data }
      errs.push(name+': sin filas');
    }catch(e){ errs.push(name+': '+e.message) }
  }
  throw new Error(errs.join(' | '));
}
loadSheet().then(arr=>{
  const prev=current; DATA=arr; current=null;
  if(view==='results'&&lastQ.trim()) renderResults(lastQ);
  else if(view==='product'&&prev){ const f=DATA.find(p=>norm(p.product)+'|'+norm(p.code)===norm(prev.product)+'|'+norm(prev.code)); if(f) renderProduct(f); else renderStart() }
  else renderStart();
}).catch(e=>console.warn('No se pudo leer Google Sheets; se usan los datos incluidos en el archivo.',e.message));
